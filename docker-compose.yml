services:
  ollama:
    image: ollama/ollama:latest
    container_name: produtos-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: produtos-backend
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: http://ollama:11434/api/chat
      OLLAMA_MODELO: qwen3:1.7b
    depends_on:
      - ollama
    volumes:
      # Persiste o banco SQLite (o arquivo precisa existir no host)
      - ./backend/produtos.db:/app/produtos.db
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: produtos-frontend
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
  frontend_node_modules:
